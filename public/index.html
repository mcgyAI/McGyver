<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mc'Gyver</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12151c;
    --panel-2: #171b24;
    --border: #232838;
    --text: #e7e9ee;
    --text-dim: #8a90a2;
    --accent: #d4a54a;
    --accent-dim: #8a6f34;
    --danger: #d4664a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    letter-spacing: 0.02em;
    margin: 0;
    font-weight: 700;
  }
  header h1 span { color: var(--accent); }
  header .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  header .status.connected { color: var(--accent); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    min-height: 0;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .side-panel { display: none; }
    .side-panel.open { display: flex; }
  }
  .chat-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent-dim);
    color: #fff;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .msg.system {
    align-self: center;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: none;
  }
  .composer {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .composer input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
  }
  .composer input:focus { outline: none; border-color: var(--accent-dim); }
  button {
    background: var(--accent);
    color: #14100a;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 500;
  }
  button.ghost.recording {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .side-panel {
    border-left: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 12px 0;
  }
  .tab.active {
    color: var(--accent);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tab-content {
    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 1;
  }
  .quick-add {
    padding: 14px 18px;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .quick-add input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  .item-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task-item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .task-item .info { min-width: 0; }
  .task-item .title { font-size: 13px; font-weight: 500; }
  .task-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .task-item .done-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 9px;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .task-item .done-btn:hover { color: var(--accent); border-color: var(--accent-dim); }
  .kb-form {
    padding: 0 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .kb-form input, .kb-form textarea {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
  }
  .kb-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .kb-item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .kb-item .title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .kb-item .content {
    font-size: 12px;
    color: var(--text-dim);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .kb-empty, .task-empty { color: var(--text-dim); font-size: 12px; padding: 4px 0; }
  .setup {
    max-width: 420px;
    margin: 80px auto;
    padding: 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .setup h2 { margin-top: 0; font-size: 16px; }
  .setup p { color: var(--text-dim); font-size: 13px; line-height: 1.6; }
  .setup input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    margin: 12px 0;
  }
</style>
</head>
<body>

<header>
  <h1>Mc'<span>Gyver</span></h1>
  <span class="status" id="statusLabel">not connected</span>
</header>

<div id="setupScreen" class="setup" style="display:none;">
  <h2>Connect to Mc'Gyver</h2>
  <p>Paste the OWNER_TOKEN from your <code>.env</code> file. It's saved in this browser only — nothing is sent anywhere except your own local server.</p>
  <input id="tokenInput" type="password" placeholder="OWNER_TOKEN" />
  <button id="saveTokenBtn" style="width:100%;">Connect</button>
</div>

<main id="appScreen" style="display:none;">
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="chatInput" type="text" placeholder="Ask Mc'Gyver anything..." autocomplete="off" />
      <button id="sendBtn">Send</button>
      <button class="ghost" id="micBtn" title="Hold to talk">Mic</button>
      <button class="ghost" id="togglePanelBtn" title="Tasks &amp; notes">Tasks &amp; notes</button>
    </div>
  </div>

  <div class="side-panel" id="sidePanel">
    <div class="tabs">
      <button class="tab active" id="tabTasksBtn" data-tab="tasks">Tasks</button>
      <button class="tab" id="tabNotesBtn" data-tab="notes">Notes</button>
    </div>

    <div class="tab-content" id="tasksTab">
      <div class="quick-add">
        <input id="taskTitle" type="text" placeholder="New task..." />
        <button id="taskAddBtn">Add</button>
      </div>
      <div class="item-list" id="taskList"></div>
    </div>

    <div class="tab-content" id="notesTab" style="display:none;">
      <div class="kb-form">
        <input id="kbTitle" type="text" placeholder="Title" />
        <textarea id="kbContent" placeholder="Paste a note, fact, or document..." rows="4"></textarea>
        <button id="kbAddBtn">Add to knowledge base</button>
      </div>
      <div class="kb-list" id="kbList"></div>
    </div>
  </div>
</main>

<script>
const API_BASE = window.location.origin;
let TOKEN = localStorage.getItem('mcgyver_owner_token') || '';

const el = id => document.getElementById(id);

function headers() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN };
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  el('messages').appendChild(div);
  el('messages').scrollTop = el('messages').scrollHeight;
}

async function sendChat() {
  const input = el('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);
  el('sendBtn').disabled = true;

  try {
    const res = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    if (!res.ok) {
      addMessage('system', 'Error: ' + (data.error || res.status));
      return;
    }
    addMessage('assistant', data.response);
  } catch (e) {
    addMessage('system', 'Could not reach Mc\'Gyver - is the server running?');
  } finally {
    el('sendBtn').disabled = false;
    input.focus();
  }
}

async function loadKnowledge() {
  try {
    const res = await fetch(API_BASE + '/knowledge', { headers: headers() });
    const data = await res.json();
    const list = el('kbList');
    list.innerHTML = '';
    if (!data.sources || data.sources.length === 0) {
      list.innerHTML = '<div class="kb-empty">Nothing added yet.</div>';
      return;
    }
    data.sources.slice().reverse().forEach(s => {
      const item = document.createElement('div');
      item.className = 'kb-item';
      item.innerHTML = '<div class="title"></div><div class="content"></div>';
      item.querySelector('.title').textContent = s.title;
      item.querySelector('.content').textContent = s.content;
      list.appendChild(item);
    });
  } catch (e) { /* silent - chat still works without this */ }
}

async function addKnowledge() {
  const title = el('kbTitle').value.trim();
  const content = el('kbContent').value.trim();
  if (!title || !content) return;
  el('kbAddBtn').disabled = true;
  try {
    const res = await fetch(API_BASE + '/knowledge', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ title, content }),
    });
    if (res.ok) {
      el('kbTitle').value = '';
      el('kbContent').value = '';
      loadKnowledge();
    }
  } finally {
    el('kbAddBtn').disabled = false;
  }
}

let mediaRecorder = null;
let audioChunks = [];

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = sendVoice;
    mediaRecorder.start();
    el('micBtn').classList.add('recording');
    el('micBtn').textContent = 'Release';
  } catch (e) {
    addMessage('system', "Couldn't access the microphone - check browser permissions.");
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  el('micBtn').classList.remove('recording');
  el('micBtn').textContent = 'Mic';
}

async function sendVoice() {
  if (audioChunks.length === 0) return;
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  addMessage('system', 'Transcribing...');
  const placeholder = el('messages').lastChild;

  try {
    const res = await fetch(API_BASE + '/voice', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'audio/webm' },
      body: blob,
    });
    placeholder.remove();

    if (!res.ok) {
      const data = await res.json();
      addMessage('system', 'Voice error: ' + (data.error || res.status));
      return;
    }

    const transcript = decodeURIComponent(res.headers.get('X-Transcript') || '');
    const replyText = decodeURIComponent(res.headers.get('X-Reply-Text') || '');
    if (transcript) addMessage('user', transcript);
    if (replyText) addMessage('assistant', replyText);

    const audioBlob = await res.blob();
    new Audio(URL.createObjectURL(audioBlob)).play();
  } catch (e) {
    placeholder.remove();
    addMessage('system', "Could not reach Mc'Gyver for voice.");
  }
}

async function loadTasks() {
  try {
    const res = await fetch(API_BASE + '/tasks', { headers: headers() });
    const data = await res.json();
    const list = el('taskList');
    list.innerHTML = '';
    const open = (data.tasks || []).filter(t => t.status === 'open');
    if (open.length === 0) {
      list.innerHTML = '<div class="task-empty">Nothing open right now.</div>';
      return;
    }
    open.forEach(t => {
      const item = document.createElement('div');
      item.className = 'task-item';
      const meta = [t.project, t.dueDate].filter(Boolean).join(' · ');
      item.innerHTML = '<div class="info"><div class="title"></div><div class="meta"></div></div><button class="done-btn">Done</button>';
      item.querySelector('.title').textContent = t.title;
      item.querySelector('.meta').textContent = meta;
      item.querySelector('.done-btn').addEventListener('click', () => completeTask(t.id));
      list.appendChild(item);
    });
  } catch (e) { /* silent - chat still works without this */ }
}

async function addTask() {
  const title = el('taskTitle').value.trim();
  if (!title) return;
  el('taskAddBtn').disabled = true;
  try {
    const res = await fetch(API_BASE + '/tasks', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ title }),
    });
    if (res.ok) {
      el('taskTitle').value = '';
      loadTasks();
    }
  } finally {
    el('taskAddBtn').disabled = false;
  }
}

async function completeTask(id) {
  await fetch(API_BASE + '/tasks/' + id + '/complete', { method: 'POST', headers: headers() });
  loadTasks();
}

function switchTab(name) {
  const isTasks = name === 'tasks';
  el('tasksTab').style.display = isTasks ? 'flex' : 'none';
  el('notesTab').style.display = isTasks ? 'none' : 'flex';
  el('tabTasksBtn').classList.toggle('active', isTasks);
  el('tabNotesBtn').classList.toggle('active', !isTasks);
}

async function checkConnection() {
  try {
    const res = await fetch(API_BASE + '/health');
    const data = await res.json();
    el('statusLabel').textContent = data.status === 'healthy' ? 'server online' : 'server issue';
    if (data.status === 'healthy') el('statusLabel').classList.add('connected');
  } catch (e) {
    el('statusLabel').textContent = 'server unreachable';
  }
}

function boot() {
  checkConnection();
  if (!TOKEN) {
    el('setupScreen').style.display = 'block';
    el('appScreen').style.display = 'none';
    return;
  }
  el('setupScreen').style.display = 'none';
  el('appScreen').style.display = 'grid';
  addMessage('system', "Connected. Ask Mc'Gyver anything below.");
  loadKnowledge();
  loadTasks();
}

el('saveTokenBtn').addEventListener('click', () => {
  const v = el('tokenInput').value.trim();
  if (!v) return;
  TOKEN = v;
  localStorage.setItem('mcgyver_owner_token', v);
  boot();
});
el('sendBtn').addEventListener('click', sendChat);
el('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
el('kbAddBtn').addEventListener('click', addKnowledge);
el('taskAddBtn').addEventListener('click', addTask);
el('taskTitle').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
el('togglePanelBtn').addEventListener('click', () => el('sidePanel').classList.toggle('open'));
el('tabTasksBtn').addEventListener('click', () => switchTab('tasks'));
el('tabNotesBtn').addEventListener('click', () => switchTab('notes'));
el('micBtn').addEventListener('mousedown', startRecording);
el('micBtn').addEventListener('mouseup', stopRecording);
el('micBtn').addEventListener('mouseleave', () => { if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording(); });
el('micBtn').addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
el('micBtn').addEventListener('touchend', e => { e.preventDefault(); stopRecording(); });

boot();
</script>
</body>
</html>
